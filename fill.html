<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعبئة بيانات الصفحة | Online Gifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#f4f3ef;--dark:#171717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Cairo",Arial,sans-serif;color:#171717}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#fff;border:1px solid #e9e2d0;border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.08);margin-bottom:18px}
h1{margin:0 0 8px;font-size:26px} h2{font-size:19px;margin:0 0 14px}
.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
label{font-weight:700;font-size:13px}
input,textarea,select{font:inherit;padding:11px 12px;border:1px solid #d9d2c2;border-radius:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}
.primary{background:var(--gold);color:#111}.msg{padding:11px 12px;border-radius:10px;background:#f7f7f7;margin-top:12px;display:none}
.msg.show{display:block}.preview{max-width:140px;max-height:140px;border-radius:14px;object-fit:cover;border:1px solid #ddd;margin-top:8px}
.hidden{display:none!important}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>تعبئة بيانات الصفحة</h1>
    <div class="muted">عبّي بياناتك مرة واحدة فقط. الحقول لا تُعبّأ تلقائيًا من بيانات المتصفح.</div>
    <div id="msg" class="msg"></div>
  </section>

  <section id="formCard" class="card hidden">
    <form autocomplete="off" id="customerForm" autocomplete="off" novalidate>
    <div class="grid">
      <div class="field">
        <label>الاسم بالعربي *</label>
        <input id="name_ar" autocomplete="off" name="name_ar_client" autocomplete="off">
      </div>
      <div class="field">
        <label>الاسم بالتركي</label>
        <input id="name_tr" autocomplete="off" name="name_tr_client" autocomplete="off">
      </div>

      <div class="field full"><label>الوصف بالعربي</label><textarea id="bio_ar" name="bio_ar_client" autocomplete="off"></textarea></div>
      <div class="field full"><label>الوصف بالتركي</label><textarea id="bio_tr" name="bio_tr_client" autocomplete="off"></textarea></div>

      <div class="field"><label>WhatsApp</label><input id="whatsapp" autocomplete="off" name="whatsapp_client" autocomplete="off"></div>
      <div class="field"><label>Instagram</label><input id="instagram" autocomplete="off" name="instagram_client" autocomplete="off"></div>
      <div class="field"><label>TikTok</label><input id="tiktok" autocomplete="off" name="tiktok_client" autocomplete="off"></div>
      <div class="field"><label>Facebook</label><input id="facebook" autocomplete="off" name="facebook_client" autocomplete="off"></div>
      <div class="field"><label>Google Maps</label><input id="maps" autocomplete="off" name="maps_client" autocomplete="off"></div>
      <div class="field"><label>قناة WhatsApp</label><input id="whatsapp_channel" autocomplete="off" name="whatsapp_channel_client" autocomplete="off"></div>
      <div class="field"><label>رقم الهاتف</label><input id="phone" autocomplete="off" name="phone_client" autocomplete="off"></div>
      <div class="field">
        <label>اللغة الافتراضية</label>
        <select id="default_language" name="language_client" autocomplete="off"><option value="ar">العربية</option><option value="tr">Türkçe</option></select>
      </div>

      <div class="field full">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input id="show_photo" type="checkbox" checked style="width:18px;height:18px" name="show_photo_client" autocomplete="off">
          أريد عرض صورتي الشخصية في الصفحة
        </label>
        <input id="photo_file" type="file" accept="image/*" name="profile_photo_client" autocomplete="off">
        <img id="preview" class="preview hidden" alt="">
        <div class="muted">إذا لم تكن تريد صورة شخصية، ألغِ الخيار واترك رفع الصورة فارغًا.</div>
      </div>
    </div>

    <div class="actions" style="margin-top:16px">
      <button class="primary" id="submitBtn">إرسال البيانات</button>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://ktlqactpljbnuwqukgiy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gQ0MHHnO15LjmWZijTV5Tw_0EbaynCE";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let customer = null;

const $ = id => document.getElementById(id);
function msg(text){ $("msg").textContent = text; $("msg").classList.add("show"); }
function tokenFromUrl(){ return new URLSearchParams(window.location.search).get("token") || ""; }

async function findCustomer(){
  const token = tokenFromUrl();
  if(!token){ msg("رابط التعبئة غير صحيح."); return; }

  const {data,error} = await client.rpc("get_customer_fill",{p_token:token});
  if(error || !data){ msg("هذا الرابط غير صالح أو تم استخدامه/انتهت صلاحيته."); return; }

  customer = data;
  $("formCard").classList.remove("hidden");
}

$("photo_file").addEventListener("change",()=>{
  const file=$("photo_file").files?.[0];
  if(!file){$("preview").classList.add("hidden");return;}
  $("preview").src=URL.createObjectURL(file);
  $("preview").classList.remove("hidden");
});

async function uploadPhotoIfNeeded(){
  const file=$("photo_file").files?.[0];
  if(!file || !$("show_photo").checked) return null;
  if(!file.type.startsWith("image/")) throw new Error("الملف يجب أن يكون صورة.");
  if(file.size>10*1024*1024) throw new Error("حجم الصورة يجب ألا يتجاوز 10MB.");

  const token=tokenFromUrl();
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${token}/profile.${ext}`;

  const {error}=await client.storage.from("customer-images").upload(path,file,{upsert:true,contentType:file.type});
  if(error) throw error;
  return client.storage.from("customer-images").getPublicUrl(path).data.publicUrl;
}

$("submitBtn").addEventListener("click",async()=>{
  try{
    if(!$("name_ar").value.trim()){msg("الاسم بالعربي مطلوب.");return;}
    const photoUrl=await uploadPhotoIfNeeded();

    const payload={
      token:tokenFromUrl(),
      name_ar:$("name_ar").value.trim(),
      name_tr:$("name_tr").value.trim()||null,
      bio_ar:$("bio_ar").value.trim()||null,
      bio_tr:$("bio_tr").value.trim()||null,
      whatsapp:$("whatsapp").value.trim()||null,
      instagram:$("instagram").value.trim()||null,
      tiktok:$("tiktok").value.trim()||null,
      facebook:$("facebook").value.trim()||null,
      maps:$("maps").value.trim()||null,
      whatsapp_channel:$("whatsapp_channel").value.trim()||null,
      phone:$("phone").value.trim()||null,
      default_language:$("default_language").value,
      show_photo:$("show_photo").checked,
      photo_url:photoUrl
    };

    const {data:result,error}=await client.rpc("submit_customer_form",{payload});
    if(error) throw error;

    const base = window.location.origin + window.location.pathname.replace(/fill\.html$/,"");
    const siteUrl = `${base}?client=${encodeURIComponent(result.slug)}`;

    $("formCard").classList.add("hidden");
    msg("تم إرسال بياناتك بنجاح. شكرًا لك.");

    const success = document.createElement("div");
    success.className = "card";
    success.innerHTML = `
      <h2>رابط صفحتك جاهز ✅</h2>
      <div class="muted" style="margin-bottom:10px">هذا هو الرابط الذي سيُستخدم على بطاقة NFC:</div>
      <input id="finalSiteLink" readonly style="width:100%;font:inherit;padding:11px 12px;border:1px solid #d9d2c2;border-radius:10px;background:#fff" value="${siteUrl}">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="primary" id="copyFinalLink" type="button">نسخ الرابط</button>
        <button class="secondary" id="openFinalLink" type="button">فتح الصفحة</button>
      </div>
    `;
    document.querySelector(".wrap").appendChild(success);

    document.getElementById("copyFinalLink").addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(siteUrl);
      }catch{
        const input = document.getElementById("finalSiteLink");
        input.select();
        document.execCommand("copy");
      }
      msg("تم نسخ رابط الصفحة.");
    });

    document.getElementById("openFinalLink").addEventListener("click", ()=>{
      window.location.href = siteUrl;
    });
  }catch(e){
    msg("تعذر إرسال البيانات: "+e.message);
  }
});

findCustomer();
</script>
</body>
</html>
