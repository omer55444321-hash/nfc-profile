<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعبئة بيانات الصفحة | Online Gifts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#f4f3ef;--dark:#171717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Cairo",Arial,sans-serif;color:#171717}
.wrap{max-width:760px;margin:auto;padding:22px}
.card{background:#fff;border:1px solid #e9e2d0;border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.08);margin-bottom:18px}
h1{margin:0 0 8px;font-size:26px} h2{font-size:19px;margin:0 0 14px}
.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}
label{font-weight:700;font-size:13px}
input,textarea,select{font:inherit;padding:11px 12px;border:1px solid #d9d2c2;border-radius:10px;background:#fff} input::placeholder,textarea::placeholder{color:#999;opacity:.58}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer}
.primary{background:var(--gold);color:#111}.msg{padding:11px 12px;border-radius:10px;background:#f7f7f7;margin-top:12px;display:none}
.msg.show{display:block}.preview{max-width:140px;max-height:140px;border-radius:14px;object-fit:cover;border:1px solid #ddd;margin-top:8px}
.hidden{display:none!important}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>

<style>
.optional-note{
  font-size:11px;
  font-weight:600;
  color:#999;
  margin-inline-start:4px;
}
</style>

<style>
.theme-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.theme-option{position:relative;display:flex;align-items:center;gap:10px;border:2px solid #e3dfd3;border-radius:14px;padding:12px;cursor:pointer;background:#fff;transition:.15s}
.theme-option:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.theme-option input{position:absolute;opacity:0;pointer-events:none}
.theme-option:has(input:checked){border-color:#c99b3b;box-shadow:0 0 0 2px rgba(201,155,59,.12)}
.theme-option span:last-child{display:flex;flex-direction:column;line-height:1.35}
.theme-option small{font-size:11px;color:#777;font-weight:500}
.theme-dot{width:34px;height:34px;border-radius:10px;flex:0 0 34px;border:1px solid rgba(0,0,0,.12)}
.theme-preview-classic .theme-dot{background:linear-gradient(135deg,#171819 0 58%,#d0a43e 58%)}
.theme-preview-corporate .theme-dot{background:linear-gradient(135deg,#08090b 0 72%,#d4ac49 72%)}
.theme-preview-feminine .theme-dot{background:linear-gradient(135deg,#fff5f2 0 55%,#d79f9b 55%)}
.theme-preview-cover .theme-dot{background:linear-gradient(180deg,#b89162 0 48%,#fff 48%)}
@media(max-width:700px){.theme-picker{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>تعبئة بيانات الصفحة</h1>
    <div class="muted">هذا رابط دائم. يمكنك العودة إليه وتعديل بياناتك في أي وقت.</div>
    <div id="msg" class="msg"></div><div id="remaining" class="muted" style="margin-top:8px"></div>
  </section>

  <section id="formCard" class="card hidden">
    <div class="grid">
      <div class="field">
        <label>الاسم بالعربي *</label>
        <input id="name_ar" placeholder="اكتب اسم الشركة أو اسمك بالعربي هنا">
      </div>
      <div class="field">
        <label>الاسم بالتركي</label>
        <input id="name_tr" placeholder="اكتب الاسم بالتركي هنا إن وجد">
      </div>

      <div class="field full"><label>الوصف بالعربي</label><textarea id="bio_ar"></textarea></div>
      <div class="field full"><label>الوصف بالتركي</label><textarea id="bio_tr"></textarea></div>

      <div class="field"><label>رابط WhatsApp <span class="optional-note">(اختياري)</span></label><input id="whatsapp" placeholder="ضع رابط الواتساب هنا"></div>
      <div class="field"><label>رابط Instagram <span class="optional-note">(اختياري)</span></label><input id="instagram" placeholder="ضع رابط حساب الإنستغرام هنا"></div>
      <div class="field"><label>رابط TikTok <span class="optional-note">(اختياري)</span></label><input id="tiktok" placeholder="ضع رابط حساب التيك توك هنا"></div>
      <div class="field"><label>رابط Facebook <span class="optional-note">(اختياري)</span></label><input id="facebook" placeholder="ضع رابط صفحة الفيسبوك هنا"></div>
      <div class="field"><label>رابط Google Maps <span class="optional-note">(اختياري)</span></label><input id="maps" placeholder="ضع رابط موقعك على الخريطة هنا"></div>
      <div class="field"><label>رابط قناة WhatsApp أو كتالوج WhatsApp <span class="optional-note">(اختياري)</span></label><input id="whatsapp_channel" placeholder="ضع رابط قناة الواتساب هنا"></div>
      <div class="field"><label>اسم زر قناة WhatsApp <span class="optional-note">(اختياري)</span></label><input id="whatsapp_channel_label" placeholder="مثلاً: كتالوج الواتساب"></div>
      <div class="field"><label>رابط موقعنا الإلكتروني <span class="optional-note">(اختياري)</span></label><input id="website_url" placeholder="ضع رابط موقعك الإلكتروني هنا"></div>

      <div class="field full">
        <label style="font-size:15px">أزرار إضافية حسب الطلب <span class="optional-note">(اختياري)</span></label>
        <div class="muted">مثال: X / Trendyol / Hepsiburada / متجرك. اكتب اسم الزر والرابط الذي تريد فتحه.</div>
      </div>
      <div class="field"><label>اسم الزر الإضافي 1</label><input id="custom_button_1_label" placeholder="مثلاً: Trendyol"></div>
      <div class="field"><label>رابط الزر الإضافي 1</label><input id="custom_button_1_url" placeholder="https://..."></div>
      <div class="field"><label>اسم الزر الإضافي 2</label><input id="custom_button_2_label" placeholder="مثلاً: Hepsiburada"></div>
      <div class="field"><label>رابط الزر الإضافي 2</label><input id="custom_button_2_url" placeholder="https://..."></div>
      <div class="field"><label>اسم الزر الإضافي 3</label><input id="custom_button_3_label" placeholder="مثلاً: X"></div>
      <div class="field"><label>رابط الزر الإضافي 3</label><input id="custom_button_3_url" placeholder="https://..."></div>
      <div class="field"><label>اسم الزر الإضافي 4</label><input id="custom_button_4_label" placeholder="مثلاً: متجرنا"></div>
      <div class="field"><label>رابط الزر الإضافي 4</label><input id="custom_button_4_url" placeholder="https://..."></div>

      <div class="field"><label>رقم الهاتف <span class="optional-note">(اختياري)</span></label><input id="phone" placeholder="أرجو وضع رقم الهاتف هنا"></div>
      <div class="field">
        <label>اللغة الافتراضية</label>
        <select id="default_language"><option value="ar">العربية</option><option value="tr">Türkçe</option></select>
      </div>

      <div class="field full">
        <label>تصميم الموقع</label>
        <div class="theme-picker">
          <label class="theme-option theme-preview-corporate">
            <input type="radio" name="theme_style" value="corporate">
            <span class="theme-dot"></span><span><b>ستايل 1 — شركات فاخر</b><small>أسود وذهبي أنيق</small></span>
          </label>
          <label class="theme-option theme-preview-feminine">
            <input type="radio" name="theme_style" value="feminine">
            <span class="theme-dot"></span><span><b>ستايل 2 — نسائي</b><small>وردي وبيج ناعم</small></span>
          </label>
          <label class="theme-option theme-preview-classic">
            <input type="radio" name="theme_style" value="classic" checked>
            <span class="theme-dot"></span><span><b>ستايل 3 — الكلاسيكي</b><small>التصميم الحالي</small></span>
          </label>
          <label class="theme-option theme-preview-cover">
            <input type="radio" name="theme_style" value="cover">
            <span class="theme-dot"></span><span><b>ستايل 4 — غلاف مودرن</b><small>الصورة تظهر كغلاف عريض</small></span>
          </label>
        </div>
        <div class="muted">اختيار التصميم يغيّر الشكل فقط. رابط العميل وبياناته لا تتغير.</div>
      </div>

      <div class="field full">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input id="show_photo" type="checkbox" checked style="width:18px;height:18px">
          أريد عرض صورتي الشخصية في الصفحة
        </label>
        <input id="photo_file" type="file" accept="image/*">
        <img id="preview" class="preview hidden" alt="">
        <div class="muted">إذا لم تكن تريد صورة شخصية، ألغِ الخيار واترك رفع الصورة فارغًا.</div>
      </div>
    </div>

    <div class="actions" style="margin-top:16px">
      <button class="primary" id="submitBtn">إرسال البيانات</button>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://ktlqactpljbnuwqukgiy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gQ0MHHnO15LjmWZijTV5Tw_0EbaynCE";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let customer = null;

const $ = id => document.getElementById(id);
function msg(text){ $("msg").textContent = text; $("msg").classList.add("show"); }
function tokenFromUrl(){ return new URLSearchParams(window.location.search).get("token") || ""; }

async function findCustomer(){
  const token = tokenFromUrl();
  if(!token){ msg("رابط التعبئة غير صحيح."); return; }

  const {data,error} = await client.rpc("get_customer_fill",{p_token:token});
  if(error || !data){ msg("هذا الرابط غير صالح أو أن الصفحة موقوفة من الإدارة."); return; }

  customer = data;
  const keys=["name_ar","name_tr","bio_ar","bio_tr","whatsapp","instagram","tiktok","facebook","maps","whatsapp_channel","whatsapp_channel_label","website_url",
    "custom_button_1_label","custom_button_1_url",
    "custom_button_2_label","custom_button_2_url",
    "custom_button_3_label","custom_button_3_url",
    "custom_button_4_label","custom_button_4_url",
    "phone","default_language"];
  keys.forEach(key=>{ const el=$(key); if(el) el.value = data[key] ?? ""; });
  const savedTheme = ["classic","corporate","feminine","cover"].includes(data.theme_style) ? data.theme_style : "classic";
  const savedThemeRadio = document.querySelector(`input[name="theme_style"][value="${savedTheme}"]`);
  if(savedThemeRadio) savedThemeRadio.checked = true;
  $("show_photo").checked = data.show_photo !== false;
  if(data.photo_url && data.show_photo){
    $("preview").src=data.photo_url;
    $("preview").classList.remove("hidden");
  }
  $("remaining").textContent="الرابط دائم — يمكنك تعديل البيانات وحفظها متى شئت.";
  $("formCard").classList.remove("hidden");
}

$("photo_file").addEventListener("change",()=>{
  const file=$("photo_file").files?.[0];
  if(!file){$("preview").classList.add("hidden");return;}
  $("preview").src=URL.createObjectURL(file);
  $("preview").classList.remove("hidden");
});

async function uploadPhotoIfNeeded(){
  const file=$("photo_file").files?.[0];
  if(!file || !$("show_photo").checked) return null;
  if(!file.type.startsWith("image/")) throw new Error("الملف يجب أن يكون صورة.");
  if(file.size>10*1024*1024) throw new Error("حجم الصورة يجب ألا يتجاوز 10MB.");

  const token=tokenFromUrl();
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${token}/profile.${ext}`;

  const {error}=await client.storage.from("customer-images").upload(path,file,{upsert:true,contentType:file.type});
  if(error) throw error;
  return client.storage.from("customer-images").getPublicUrl(path).data.publicUrl;
}

$("submitBtn").addEventListener("click",async()=>{
  try{
    if(!$("name_ar").value.trim()){msg("الاسم بالعربي مطلوب.");return;}
    const photoUrl=await uploadPhotoIfNeeded();

    const payload={
      token:tokenFromUrl(),
      name_ar:$("name_ar").value.trim(),
      name_tr:$("name_tr").value.trim()||null,
      bio_ar:$("bio_ar").value.trim()||null,
      bio_tr:$("bio_tr").value.trim()||null,
      whatsapp:$("whatsapp").value.trim()||null,
      instagram:$("instagram").value.trim()||null,
      tiktok:$("tiktok").value.trim()||null,
      facebook:$("facebook").value.trim()||null,
      maps:$("maps").value.trim()||null,
      whatsapp_channel:$("whatsapp_channel").value.trim()||null,
      whatsapp_channel_label:$("whatsapp_channel_label").value.trim()||null,
      website_url:$("website_url").value.trim()||null,
      custom_button_1_label:$("custom_button_1_label").value.trim()||null,
      custom_button_1_url:$("custom_button_1_url").value.trim()||null,
      custom_button_2_label:$("custom_button_2_label").value.trim()||null,
      custom_button_2_url:$("custom_button_2_url").value.trim()||null,
      custom_button_3_label:$("custom_button_3_label").value.trim()||null,
      custom_button_3_url:$("custom_button_3_url").value.trim()||null,
      custom_button_4_label:$("custom_button_4_label").value.trim()||null,
      custom_button_4_url:$("custom_button_4_url").value.trim()||null,
      phone:$("phone").value.trim()||null,
      default_language:$("default_language").value,
      theme_style:document.querySelector('input[name="theme_style"]:checked')?.value||"classic",
      show_photo:$("show_photo").checked,
      photo_url:photoUrl
    };

    const {data:result,error}=await client.rpc("submit_customer_form",{payload});
    if(error) throw error;

    $("remaining").textContent="الرابط دائم — يمكنك تعديل البيانات وحفظها متى شئت.";
    msg("تم حفظ بياناتك بنجاح. يمكنك العودة إلى نفس الرابط والتعديل في أي وقت.");
    $("submitBtn").textContent="حفظ التحديث";
  }catch(e){
    msg("تعذر إرسال البيانات: "+e.message);
  }
});

findCustomer();
</script>
</body>
</html>
