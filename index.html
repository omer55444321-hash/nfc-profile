<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أونلاين للهدايا | Online Gifts</title>

<meta name="description"
content="أونلاين للهدايا - عالم الهدايا المطبوعة والمخصصة والهدايا المميزة في تركيا">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    background:#080808;
    color:#fff;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:28px 18px 35px;
}

/* =========================
   LOGO
========================= */

.logo-area{
    text-align:center;
    margin-bottom:18px;
}

.logo{
    width:155px;
    height:155px;
    object-fit:contain;
    border-radius:50%;
    border:2px solid #c9a227;
    padding:4px;
    background:#000;
    box-shadow:
        0 0 20px rgba(201,162,39,.25),
        0 0 45px rgba(201,162,39,.08);
}

.brand-name{
    margin-top:14px;
    font-size:30px;
    font-weight:800;
    color:#d4af37;
    letter-spacing:-1px;
}

.brand-en{
    margin-top:2px;
    color:#c9a227;
    font-size:13px;
    font-weight:600;
}

.description{
    margin-top:10px;
    color:#aaa;
    font-size:12px;
}

/* =========================
   GOLD LINE
========================= */

.gold-line{
    width:75px;
    height:1px;
    background:#c9a227;
    margin:15px auto 18px;
    opacity:.8;
}

/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.btn{
    width:100%;
    min-height:55px;
    border-radius:13px;
    border:1px solid #b99520;
    background:linear-gradient(
        135deg,
        #151515,
        #0d0d0d
    );
    color:#fff;
    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    font-size:15px;
    font-weight:700;

    transition:.2s ease;

    box-shadow:
        0 4px 15px rgba(0,0,0,.35);
}

.btn:hover{
    transform:translateY(-2px);
    border-color:#e0bd45;
    box-shadow:
        0 6px 20px rgba(201,162,39,.15);
}

.btn-main{
    background:linear-gradient(
        135deg,
        #d7b43a,
        #a98217
    );

    color:#080808;
    border:none;
    font-weight:800;
}

.btn-main:hover{
    background:linear-gradient(
        135deg,
        #e4c34d,
        #b58c1c
    );
}

.icon{
    font-size:20px;
    line-height:1;
}

/* =========================
   WORK SECTION
========================= */

.work-section{
    margin-top:25px;
}

.section-title{
    text-align:center;
    color:#d4af37;
    font-size:20px;
    font-weight:800;
    margin-bottom:14px;
}

.works{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.work{
    background:#111;
    border:1px solid #292929;
    border-radius:9px;
    overflow:hidden;
    position:relative;
    aspect-ratio:1/1;
}

.work img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.work-title{
    position:absolute;
    bottom:0;
    right:0;
    left:0;

    padding:7px 4px;

    text-align:center;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );

    color:#fff;
    font-size:10px;
    font-weight:600;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:24px;
    color:#777;
    font-size:10px;
}

.footer strong{
    color:#d4af37;
    font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .page{
        padding:22px 14px 28px;
    }

    .logo{
        width:135px;
        height:135px;
    }

    .brand-name{
        font-size:27px;
    }

    .btn{
        min-height:57px;
        font-size:14px;
    }

    .works{
        gap:6px;
    }

    .work-title{
        font-size:9px;
    }
}

</style>
</head>

<body>

<main class="page">

    <!-- LOGO -->

    <section class="logo-area">

        <img
            class="logo"
            src="profile.jpg"
            alt="أونلاين للهدايا"
        >

        <h1 class="brand-name">
            أونلاين للهدايا
        </h1>

        <div class="brand-en">
            Online Gifts
        </div>

        </p>

    </section>


    <!-- BUTTONS -->

    <section class="buttons">

        <!-- ADD CONTACT -->

        <a

        <!-- WHATSAPP -->

        <a
            class="btn"
            href="https://wa.me/message/LR3NY7SMCEM3B1/"

        >
            <span class="icon">💬</span>

        <!-- INSTAGRAM -->

        <a
            class="btn"
            href="https://www.instagram.com/telef98/?hl=ar"

        >

        </a>


        <!-- TIKTOK -->

        <a
            class="btn"
            href="https://www.tiktok.com/@on_gift"
            target="_blank"
        >
            <span class="icon">♪</span>
            TikTok
        </a>


        <!-- FACEBOOK -->

        <a
            class="btn"
            href="https://www.facebook.com/onlayinn"
            target="_blank"
        >
            <span class="icon">f</span>
            Facebook
        </a>


        <!-- GOOGLE MAPS -->

        <a
            class="btn"
            href="https://g.page/r/CRAfNQ9SrlvSEAE/review"
            target="_blank"
        >
            <span class="icon">📍</span>
            قيّمنا على Google Maps
        </a>


        <!-- WHATSAPP CHANNEL -->

        <a
            class="btn"
            href="https://whatsapp.com/channel/0029VaaNlxi2UPBBkc38612Z"
            target="_blank"
        >
            <span class="icon">📢</span>
            قناتنا على واتساب
        </a>

    </section>


    <!-- OUR WORK -->

    <section class="work-section">

        <h2 class="section-title">
            من أعمالنا
        </h2>

        <div class="works">


            <!-- CUSTOM GIFTS -->

            <div class="work">

                <img
                    src="work-1.jpg"
                    alt="هدايا مخصصة"
                >

                <div class="work-title">
                    هدايا مخصصة
                </div>

            </div>


            <!-- PRINTING -->

            <div class="work">

                <img
                    src="work-2.jpg"
                    alt="طباعة"
                >

                <div class="work-title">
                    طباعة
                </div>

            </div>


            <!-- 3D PRINTING -->

            <div class="work">

                <img
                    src="work-3.jpg"
                    alt="طباعة 3D"
                >

                <div class="work-title">
                    طباعة 3D
                </div>

            </div>


            <!-- GIFTS -->

            <div class="work">

                <img
                    src="work-4.jpg"
                    alt="هدايا"
                >

                <div class="work-title">
                    هدايا
                </div>

            </div>


        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <strong>
            أونلاين للهدايا
        </strong>

        <br>

        جميع الحقوق محفوظة

    </footer>

</main>

</body>
</html>
